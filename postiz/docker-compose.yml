# Local, single-user Postiz stack - deliberately pinned to v2.11.3, the
# last release before Postiz made Temporal + Elasticsearch a hard
# dependency (see docs-mpostele/03 Workflow/05 Platform Adaptation & Export.md).
# That combination alone regularly wants 2-4GB+ RAM; this 3-container setup
# (app + Postgres + Redis) was the officially documented shape before that
# and is the only one that fits a machine that's often under 1GB free.
#
# Usage: copy .env.example to .env, fill it in, then `docker compose up -d`
# from this directory. See README.md for the full walkthrough.
services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:v2.11.3
    container_name: postiz
    restart: unless-stopped
    environment:
      MAIN_URL: "http://localhost:${POSTIZ_PORT:-4007}"
      FRONTEND_URL: "http://localhost:${POSTIZ_PORT:-4007}"
      NEXT_PUBLIC_BACKEND_URL: "http://localhost:${POSTIZ_PORT:-4007}/api"
      JWT_SECRET: "${POSTIZ_JWT_SECRET:?set a random, unique string in postiz/.env - see README.md}"
      DATABASE_URL: "postgresql://postiz-user:postiz-password@postiz-postgres:5432/postiz-db-local"
      REDIS_URL: "redis://postiz-redis:6379"
      BACKEND_INTERNAL_URL: "http://localhost:3000"
      IS_GENERAL: "true"
      DISABLE_REGISTRATION: "false"
      STORAGE_PROVIDER: "local"
      UPLOAD_DIRECTORY: "/uploads"
      NEXT_PUBLIC_UPLOAD_DIRECTORY: "/uploads"
      # Only needed to CONNECT that platform's account (each requires your
      # own developer app registered with that platform - Postiz's own
      # hosted app credentials aren't available to self-hosted instances).
      # Leave blank to skip a platform for now; add and `docker compose up
      # -d` again later to enable it.
      X_API_KEY: "${X_API_KEY:-}"
      X_API_SECRET: "${X_API_SECRET:-}"
      LINKEDIN_CLIENT_ID: "${LINKEDIN_CLIENT_ID:-}"
      LINKEDIN_CLIENT_SECRET: "${LINKEDIN_CLIENT_SECRET:-}"
      TIKTOK_CLIENT_ID: "${TIKTOK_CLIENT_ID:-}"
      TIKTOK_CLIENT_SECRET: "${TIKTOK_CLIENT_SECRET:-}"
      # Instagram "Standalone" (recommended for a single account, no linked
      # Facebook Page needed) - confirmed against v2.11.3's actual
      # instagram.standalone.provider.ts, not just the current docs.
      INSTAGRAM_APP_ID: "${INSTAGRAM_APP_ID:-}"
      INSTAGRAM_APP_SECRET: "${INSTAGRAM_APP_SECRET:-}"
      # Instagram "Business" (alternative - needs a Facebook Page linked to
      # the Instagram account, but unlocks Reels audio). Leave blank unless
      # you specifically want this path instead of Standalone above.
      FACEBOOK_APP_ID: "${FACEBOOK_APP_ID:-}"
      FACEBOOK_APP_SECRET: "${FACEBOOK_APP_SECRET:-}"
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    ports:
      - "${POSTIZ_PORT:-4007}:5000"
    networks:
      - postiz-network
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy

  postiz-postgres:
    image: postgres:17-alpine
    container_name: postiz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postiz-password
      POSTGRES_USER: postiz-user
      POSTGRES_DB: postiz-db-local
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    networks:
      - postiz-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz-user -d postiz-db-local"]
      interval: 10s
      timeout: 3s
      retries: 3

  postiz-redis:
    image: redis:7.2
    container_name: postiz-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - postiz-redis-data:/data
    networks:
      - postiz-network

volumes:
  postgres-volume:
  postiz-redis-data:
  postiz-config:
  postiz-uploads:

networks:
  postiz-network:
